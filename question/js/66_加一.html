<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>66_加一</title>
  </head>
  <body></body>
  <script>
    /**
     * @param {number[]} digits
     * @return {number[]}
     */
    var plusOne1 = function (digits) {
      for (let i = digits.length - 1; i >= 0; i--) {
        if (digits[i] === 9) {
          digits[i] = 0;
          if (i === 0) {
            digits.unshift(1);
          } else {
            digits[i - 1] + 1;
          }
        } else {
          digits[i] = digits[i] + 1;
          break;
        }
      }
      return digits;
    };

    /**
     * @param {number[]} digits
     * @return {number[]}
     */
    var plusOne2 = function (digits) {
      let carry = false;
      digits[digits.length - 1]++;
      for (let i = digits.length - 1; i >= 0; i--) {
        if (carry) {
          digits[i]++;
        }
        carry = digits[i] > 9;
        digits[i] %= 10;
      }
      if (carry) {
        digits.unshift(1);
      }
      return digits;
    };

    /**
     * 第三种思路(对第一种的优化)
     * @param {number[]} digits
     * @return {number[]}
     */
    var plusOne = function (digits) {
      for (let i = digits.length - 1; i >= 0; i--) {
        // 先解决小于9的
        if (digits[i] < 9) {
          digits[i]++;
          return digits;
        }
        // 大于等于9的，当前位数赋值0，进入下一轮循环
        digits[i] = 0;
      }
      // 始终没有找到小于9的，可能是[9, 9]或者 [9, 9, 9]这样的结构，前一位直接补1
      digits.unshift(1);
      return digits;
    };
  </script>
</html>
