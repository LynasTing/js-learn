    /**
     * 二分查找
     */
    var mySqrt = function (x) {
      console.log(`x + ::>>`, x);
      // 排除 0 和 1
      if (x <= 1) {
        return x;
      }

      let left = 1,
        right = x,
        answer = 0;

      while (left < right) {
        const mid = Math.floor((left + right) / 2);
        console.log(`mid + ::>>`, mid);
        // 正好相等
        if (mid * mid === x) {
          return mid;
        }
        // 大了
        if (mid * mid > x) {
          right = mid - 1;
        } else {
          left = mid + 1;
          answer = mid;
        }
      }
      return answer;
    };

    console.log(` mySqrt(8); + ::>>`, mySqrt(8));
